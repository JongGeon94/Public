<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산자동차마이스터고등학교 대/공기업반 자료</title>
  <meta name="version" content="3">
  <link rel="stylesheet" href="style.css?v=27">
  <script>document.documentElement.classList.add("motion");setTimeout(function(){if(!window.__motionReady)document.documentElement.classList.remove("motion")},2500);</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">대/공기업반 자료</a>
      <a class="topbar-cta" href="https://jonggeon94.github.io/Interview/" target="_blank" rel="noopener noreferrer">면접 자료</a>
    </div>
  </header>

  <main class="page">
    <header class="hero">
      <div class="logo-wrap" id="logoWrap">
        <img id="schoolLogo" src="logo.png" alt="부산자동차마이스터고등학교 로고">
        <div class="logo-fallback">학교 로고</div>
      </div>
      <h1 data-split>대/공기업반 자료</h1>
      <p class="subtitle">선배들의 합격 노하우를 한곳에.</p>
      <div class="actions">
        <a class="btn" href="#companies">기업체 보기</a>
        <a class="btn btn-outline" href="https://jonggeon94.github.io/Interview/" target="_blank" rel="noopener noreferrer">면접 자료</a>
      </div>
    </header>

    <nav class="tabs" id="companies" aria-label="기업체">
      <a class="tab is-light" href="KAI.html">
        <span class="tab-logo"><img src="logos/kai.png?v=2" alt=""></span>
        <span class="tab-name">한국항공우주산업(KAI)</span>
        <span class="tab-more">더 알아보기</span>
      </a>
      <a class="tab is-light" href="SDC.html">
        <span class="tab-logo"><img src="logos/samsung-display.png" alt=""></span>
        <span class="tab-name">삼성디스플레이</span>
        <span class="tab-more">더 알아보기</span>
      </a>
      <a class="tab is-light" href="KORAIL.html">
        <span class="tab-logo"><img src="logos/korail.jpg?v=1" alt=""></span>
        <span class="tab-name">한국철도공사(KORAIL)</span>
        <span class="tab-more">더 알아보기</span>
      </a>
      <a class="tab is-light" href="TS.html">
        <span class="tab-logo"><img src="logos/ts.png?v=1" alt=""></span>
        <span class="tab-name">한국교통안전공단(TS)</span>
        <span class="tab-more">더 알아보기</span>
      </a>
      <span class="tab tab-soon">
        <span class="tab-name">기업체 5</span>
        <span class="tab-more">준비 중</span>
      </span>
      <span class="tab tab-soon">
        <span class="tab-name">기업체 6</span>
        <span class="tab-more">준비 중</span>
      </span>
      <span class="tab tab-soon">
        <span class="tab-name">기업체 7</span>
        <span class="tab-more">준비 중</span>
      </span>
      <span class="tab tab-soon">
        <span class="tab-name">기업체 8</span>
        <span class="tab-more">준비 중</span>
      </span>
    </nav>
    <p class="version">Version 3</p>
  </main>

  <div class="toast" id="updateToast" role="status" aria-live="polite">
    <div class="toast-body">
      <strong>Version 3 Update : 자가진단</strong>
      <span>기업체 페이지에서 '자가진단 해보기'를 눌러 보세요.</span>
    </div>
    <button class="toast-close" type="button" aria-label="알림 닫기">&times;</button>
  </div>

  <script>
    const logo = document.getElementById("schoolLogo");
    const logoWrap = document.getElementById("logoWrap");

    function showLogoFallback() {
      logoWrap.classList.add("is-missing");
    }

    logo.addEventListener("error", showLogoFallback);
    if (logo.complete && logo.naturalWidth === 0) {
      showLogoFallback();
    }

    const toast = document.getElementById("updateToast");
    function hideToast() {
      toast.classList.remove("is-open");
    }
    toast.querySelector(".toast-close").addEventListener("click", hideToast);
    setTimeout(function () { toast.classList.add("is-open"); }, 600);
    setTimeout(hideToast, 6600);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="motion.js"></script>
</body>
</html>
